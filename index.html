<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Labirinto Ético Digital</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@keyframes shake {
  0% { transform: translate(0px, 0px); }
  25% { transform: translate(5px, 0px); }
  50% { transform: translate(-5px, 0px); }
  75% { transform: translate(5px, 0px); }
  100% { transform: translate(0px, 0px); }
}
.shake { animation: shake 0.4s; }
</style>
</head>

<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

<!-- START -->
<div id="startScreen" class="text-center max-w-xl p-6">
  <h1 class="text-3xl mb-4">📱 Um Dia na Sua Vida Digital</h1>
  <p class="mb-2 text-lg">🧠 Descubra seu perfil digital</p>
  <p class="mb-6 text-gray-300">Suas escolhas mostram sua ética online.</p>
  <button onclick="startGame()" class="border border-white px-6 py-3 rounded hover:bg-white hover:text-black">
    ▶ Começar
  </button>
</div>

<!-- GAME -->
<div id="gameScreen" class="hidden text-center max-w-xl p-6">
  <h1 class="text-2xl mb-4">🌐 Sua Jornada Digital</h1>

  <p id="counter" class="mb-2 text-sm text-gray-400"></p>
  <p id="story" class="mb-3 text-gray-300"></p>
  <p id="question" class="mb-6 text-lg"></p>

  <div id="options" class="space-y-3"></div>

  <div id="feedback" class="mt-4 text-sm hidden p-3 rounded border"></div>

  <div class="mt-6">
    ⚖️ Ética: <span id="etica">0</span> |
    🔓 Risco: <span id="risco">0</span>
  </div>
</div>

<script>
let step = 0, etica = 0, risco = 0;

function startGame(){
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  load();
}

/* 🎮 SCENES */
const scenes = [
{story:"⏰ Você acorda e vê que o filme que esperava lançou.",question:"O que faz?",
options:[
{text:"Usa pirataria.",e:-2,r:2,f:"Pirataria prejudica criadores."},
{text:"Espera lançamento oficial.",e:2,r:0,f:"Você apoia conteúdo legal."}
]},

{story:"📱 App pede permissões.",question:"O que faz?",
options:[
{text:"Aceita tudo.",e:0,r:3,f:"Risco de dados expostos."},
{text:"Analisa permissões.",e:2,r:-1,f:"Boa prática de privacidade."}
]},

{story:"📰 Notícia viral.",question:"O que faz?",
options:[
{text:"Compartilha sem verificar.",e:-2,r:1,f:"Fake news podem se espalhar."},
{text:"Verifica antes.",e:3,r:-1,f:"Você evita desinformação."}
]},

{story:"💻 Vazamento de dados.",question:"Reação?",
options:[
{text:"Ignora.",e:0,r:2,f:"Problema continua."},
{text:"Age para resolver.",e:2,r:-1,f:"Boa prática de segurança."}
]},

{story:"🔐 Senhas.",question:"O que faz?",
options:[
{text:"Reutiliza senha.",e:-1,r:3,f:"Risco de ataque em cadeia."},
{text:"Usa senhas diferentes.",e:2,r:-2,f:"Mais segurança."}
]},

{story:"📍 Localização.",question:"Aceita?",
options:[
{text:"Sim.",e:0,r:2,f:"Exposição de rotina."},
{text:"Só quando necessário.",e:2,r:-1,f:"Mais privacidade."}
]},

{story:"📧 E-mail suspeito.",question:"O que faz?",
options:[
{text:"Clica no link.",e:-2,r:3,f:"Phishing perigoso."},
{text:"Denuncia spam.",e:3,r:-2,f:"Protege você e outros."}
]},

{story:"💬 Fake news.",question:"O que faz?",
options:[
{text:"Compartilha.",e:-2,r:1,f:"Desinformação."},
{text:"Verifica.",e:2,r:-1,f:"Responsável."}
]},

{story:"📦 Software pago.",question:"O que faz?",
options:[
{text:"Baixa pirata.",e:-2,r:2,f:"Risco de malware."},
{text:"Compra oficial.",e:2,r:0,f:"Seguro e legal."}
]},

{story:"🔒 2FA.",question:"Ativa?",
options:[
{text:"Não.",e:-1,r:2,f:"Menos segurança."},
{text:"Sim.",e:2,r:-2,f:"Mais proteção."}
]},

{story:"🌙 Final do dia.",question:"Usa dados de outra pessoa?",
options:[
{text:"Sim.",e:-3,r:2,f:"Violação ética e legal."},
{text:"Não.",e:3,r:-1,f:"Você age com ética digital."}
]}
];

/* 🎮 LOAD */
function load(){
  if(step >= scenes.length){
    endGame();
    return;
  }

  let s = scenes[step];

  document.getElementById("story").innerText = s.story;
  document.getElementById("question").innerText = s.question;
  document.getElementById("counter").innerText = `Momento ${step+1} de ${scenes.length}`;

  let optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  let fb = document.getElementById("feedback");
  fb.classList.add("hidden");

  s.options.forEach(opt => {
    let btn = document.createElement("button");
    btn.className = "w-full border border-white p-3 rounded hover:bg-white hover:text-black";
    btn.innerText = opt.text;
    btn.onclick = () => answer(opt, btn);
    optionsDiv.appendChild(btn);
  });
}

/* 🎯 ANSWER */
function answer(op, btn){
  etica += op.e;
  risco += op.r;

  document.getElementById("etica").innerText = etica;
  document.getElementById("risco").innerText = risco;

  document.querySelectorAll("#options button").forEach(b => b.disabled = true);
  document.getElementById("options").style.pointerEvents = "none";

  let fb = document.getElementById("feedback");

  if(op.e > 0){
    btn.style.background = "#14532d";
    btn.style.border = "2px solid #22c55e";
    fb.style.background = "#14532d";
    fb.style.border = "2px solid #22c55e";
    document.body.style.background = "#052e16";
  } else {
    btn.style.background = "#7f1d1d";
    btn.style.border = "2px solid #ef4444";
    fb.style.background = "#7f1d1d";
    fb.style.border = "2px solid #ef4444";
    document.body.style.background = "#450a0a";

    document.getElementById("gameScreen").classList.add("shake");
    setTimeout(()=>{
      document.getElementById("gameScreen").classList.remove("shake");
    },400);
  }

  fb.innerText = op.f;
  fb.classList.remove("hidden");

  setTimeout(()=>{
    document.body.style.background = "";
    document.getElementById("options").style.pointerEvents = "auto";
    step++;
    load();
  }, 5000);
}

/* 🏁 END */
function endGame(){
document.body.innerHTML = `
<div class="text-center p-6">
<h1 class="text-3xl">📊 Resultado Final</h1>
<p class="mt-4">⚖️ Ética: ${etica} | 🔓 Risco: ${risco}</p>
<p class="mt-6">Obrigado por jogar o Labirinto Ético Digital.</p>
</div>
`;
}
</script>

</body>
</html>
